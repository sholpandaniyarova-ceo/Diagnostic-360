<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>M-CHAT-R — Скрининг риска аутизма · Diagnostic 360</title>
  <style>
    :root {
      --bg: #F7F8FA;
      --card: #FFFFFF;
      --ink: #1A1F36;
      --muted: #6B7280;
      --border: #E5E7EB;
      --brand: #1F3864;
      --brand-light: #2E5BAA;
      --green: #2E7D32;
      --green-bg: #E8F5E9;
      --yellow: #E65100;
      --yellow-bg: #FFF3E0;
      --red: #C62828;
      --red-bg: #FFEBEE;
      --shadow: 0 2px 12px rgba(26,31,54,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    /* NAV */
    .nav {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--brand-light), var(--brand));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 13px; flex-shrink: 0;
    }
    .nav-title { font-weight: 700; font-size: 14px; flex: 1; }
    .nav-sub { font-size: 10px; color: var(--muted); }
    .lang-switcher { display: flex; gap: 3px; }
    .lang-btn {
      padding: 3px 7px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--muted); font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .lang-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

    /* PROGRESS */
    .progress-wrap { background: var(--border); height: 3px; }
    .progress-bar { height: 100%; background: var(--brand); transition: width .3s ease; }

    /* CONTENT */
    .content { flex: 1; padding: 24px 20px 48px; }

    /* BUTTONS */
    .btn {
      display: block; width: 100%;
      padding: 14px 20px; border-radius: 10px;
      border: none; font-family: inherit;
      font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all .15s; text-align: center;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: #26437a; }
    .btn-secondary {
      background: var(--card); color: var(--ink);
      border: 1.5px solid var(--border); margin-top: 10px;
    }
    .btn-secondary:hover { background: var(--bg); }

    /* WELCOME */
    .welcome-logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, var(--brand-light), var(--brand));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 22px;
      margin-bottom: 20px;
    }
    .welcome-title { font-size: 26px; font-weight: 700; color: var(--brand); margin-bottom: 10px; }
    .welcome-desc { color: var(--muted); font-size: 15px; margin-bottom: 22px; line-height: 1.6; }
    .features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .feature { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
    .feature-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .feature-text { color: var(--muted); }

    /* FORM */
    .section-h { margin-bottom: 20px; }
    .section-h h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .section-h p { font-size: 14px; color: var(--muted); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .req { color: var(--red); margin-left: 3px; }
    .form-input {
      width: 100%; padding: 12px 14px;
      border-radius: 8px; border: 1.5px solid var(--border);
      font-family: inherit; font-size: 15px; color: var(--ink);
      background: var(--card); transition: border-color .15s;
      -webkit-appearance: none;
    }
    .form-input:focus { outline: none; border-color: var(--brand); }
    .form-hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

    /* QUIZ */
    .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .domain-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 999px;
      background: #DDEBF7; color: var(--brand);
      font-size: 12px; font-weight: 600;
    }
    .q-counter { font-size: 12px; color: var(--muted); }
    .q-text { font-size: 19px; font-weight: 500; line-height: 1.45; margin-bottom: 28px; }
    .ans-btn {
      display: block; width: 100%;
      padding: 14px 16px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--card);
      font-family: inherit; font-size: 15px; font-weight: 500;
      cursor: pointer; text-align: left; transition: all .15s;
      margin-bottom: 10px; color: var(--ink);
    }
    .ans-btn:hover { border-color: var(--brand); background: #EFF4FC; }
    .ans-btn.yes:hover { border-color: var(--green); background: var(--green-bg); }
    .ans-btn.no:hover { border-color: var(--red); background: var(--red-bg); }

    /* REPORT */
    .report-center { text-align: center; margin-bottom: 22px; }
    .report-light {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto 14px;
    }
    .light-green { background: var(--green); }
    .light-yellow { background: var(--yellow); }
    .light-red { background: var(--red); }
    .report-lvl { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
    .lvl-green { color: var(--green); }
    .lvl-yellow { color: var(--yellow); }
    .lvl-red { color: var(--red); }
    .report-meta { font-size: 13px; color: var(--muted); }
    .rec {
      padding: 14px 16px; border-radius: 10px;
      font-size: 14px; line-height: 1.6; margin-bottom: 18px;
    }
    .rec-green { background: var(--green-bg); color: #1B5E20; }
    .rec-yellow { background: var(--yellow-bg); color: #7F3B00; }
    .rec-red { background: var(--red-bg); color: #7F0000; }
    .domains-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
    .sc-green { color: var(--green); }
    .sc-yellow { color: var(--yellow); }
    .sc-red { color: var(--red); }

    .disclaimer {
      padding: 12px 14px; border-radius: 8px;
      background: #F3F4F6; border: 1px solid var(--border);
      font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;
    }
    .footer-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px; }

    /* PRINT */
    @media print {
      body { background: white; }
      #app { max-width: 100%; }
      .nav { position: static; }
      .lang-switcher, .progress-wrap, .btn, .ans-btn, .no-print { display: none !important; }
      .print-report { display: block !important; }
    }
    .print-report { display: none; }
    .print-domain-row { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #eee; }

    /* M-CHAT-R specific */
    .age-warn {
      padding: 12px 14px; border-radius: 8px;
      background: var(--yellow-bg); color: #7F3B00;
      font-size: 13px; line-height: 1.6; margin-bottom: 16px;
      border: 1px solid #FFE0B2;
    }
    .flag-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .flag-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 14px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border);
      font-size: 13px; line-height: 1.5;
    }
    .flag-num {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      background: var(--red-bg); color: var(--red);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .score-big { font-size: 15px; font-weight: 700; margin-top: 2px; }
  </style>
</head>

           kz:'Балаңыз оған бір нәрсе істеуді айтқанда түсіне ме? (Мысалы, егер сіз ишарат (жест) жасамасаңыз, ол «кітапты үстелге қой» немесе «допты әкел» деген өтінішті түсіне ме?)' },

           kz:'Егер жаңа бір нәрсе болса, балаңыз сіздің реакцияңызды түсіну үшін бетіңізге қарай ма? (Мысалы, оғаш дыбыс естісе немесе жаңа ойыншық көрсе, сіздің жүзіңізге қарай ма?)' },

           kz:'Балаңызға қозғалыс белсенділігі ұнай ма? (Мысалы, оны әткеншекте тербеткенде немесе тізеңізге салып секірткенде?)' },

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function tx(obj, key) { const p = key.split('.'); let v = obj; for (const k of p) v = v?.[k]; return v || key; }
function t(key) { return tx(T[S.lang], key); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function setLang(l) { S.lang = l; render(); }
function goTo(scr) { S.screen = scr; render(); window.scrollTo(0, 0); }
function ageOutOfRange() { return S.childAge !== null && (S.childAge < 16 || S.childAge > 30); }

// ─────────────────────────────────────────
// SCORING (official M-CHAT-R algorithm)
// ─────────────────────────────────────────
function isRisk(id, ans) { return REVERSE.has(id) ? ans === 'yes' : ans === 'no'; }
function calcScore() {
  let score = 0; const flagged = [];
  QS.forEach(q => {
    const ans = S.answers[q.id];
    if (ans !== undefined && isRisk(q.id, ans)) { score++; flagged.push(q); }
  });
  return { score, flagged };
}
function riskCls(score) { return score <= 2 ? 'green' : score <= 7 ? 'yellow' : 'red'; }

// ─────────────────────────────────────────
// FLOW
// ─────────────────────────────────────────
function startQuiz() {
  const age = parseInt(document.getElementById('ageInput').value);
  const name = document.getElementById('nameInput').value.trim();
  if (!age || age < 12 || age > 48) { alert(t('child.errAge')); return; }
  S.childAge = age; S.childName = name; S.qIdx = 0; S.answers = {};
  goTo('quiz');
}
function checkAgeWarn() {
  const age = parseInt(document.getElementById('ageInput').value);
  const el = document.getElementById('ageWarn');
  if (el) el.style.display = (age && (age < 16 || age > 30)) ? 'block' : 'none';
}
function answer(val) {
  S.answers[QS[S.qIdx].id] = val;
  if (S.qIdx < QS.length - 1) { S.qIdx++; render(); window.scrollTo(0, 0); }
  else goTo('report');
}
function savePDF() {
  if (S.screen !== 'report') { S.screen = 'report'; render(); }
  setTimeout(() => window.print(), 80);
}
function pct() {
  if (S.screen === 'welcome') return 0;
  if (S.screen === 'child') return 8;
  if (S.screen === 'quiz') return 8 + Math.round(84 * S.qIdx / QS.length);
  return 100;
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function nav(progress) {
  return `<div class="nav">
    <div class="nav-logo">D°</div>
    <div><div class="nav-title">${t('appName')}</div><div class="nav-sub">${t('appSub')}</div></div>
    <div class="lang-switcher">
      ${['ru','kz'].map(l=>`<button class="lang-btn${S.lang===l?' active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
    </div>
  </div>
  ${progress ? `<div class="progress-wrap"><div class="progress-bar" style="width:${pct()}%"></div></div>` : ''}`;
}

function screenWelcome() {
  return `${nav(false)}<div class="content">
    <div class="welcome-logo">D°</div>
    <h1 class="welcome-title">${t('welcome.title')}</h1>
    <p class="welcome-desc">${t('welcome.desc')}</p>
    <div class="features">
      <div class="feature"><span class="feature-icon">⏱️</span><span class="feature-text">${t('welcome.f1')}</span></div>
      <div class="feature"><span class="feature-icon">👶</span><span class="feature-text">${t('welcome.f2')}</span></div>
      <div class="feature"><span class="feature-icon">📊</span><span class="feature-text">${t('welcome.f3')}</span></div>
    </div>
    <div class="disclaimer">${t('welcome.disc')}</div>
    <button class="btn btn-primary" onclick="goTo('child')">${t('welcome.start')}</button>
    <p class="footer-note">Diagnostic 360 · Basqa Development Space · M-CHAT-R™ © 2009 Robins, Fein, & Barton</p>
  </div>`;
}

function screenChild() {
  return `${nav(true)}<div class="content">
    <div class="section-h"><h2>${t('child.title')}</h2><p>${t('child.desc')}</p></div>
    <div class="form-group">
      <label class="form-label" for="nameInput">${t('child.nameLbl')}</label>
      <input class="form-input" type="text" id="nameInput" placeholder="${t('child.namePh')}" value="${S.childName}">
    </div>
    <div class="form-group">
      <label class="form-label" for="ageInput">${t('child.ageLbl')} <span class="req">*</span></label>
      <input class="form-input" type="number" id="ageInput" placeholder="${t('child.agePh')}" min="12" max="48" value="${S.childAge||''}" oninput="checkAgeWarn()">
      <div class="form-hint">${t('child.ageHint')}</div>
    </div>
    <div class="age-warn" id="ageWarn" style="display:${ageOutOfRange()?'block':'none'}">${t('child.warn')}</div>
    <button class="btn btn-primary" onclick="startQuiz()">${t('child.next')}</button>
  </div>`;
}

function screenQuiz() {
  const q = QS[S.qIdx];
  return `${nav(true)}<div class="content">
    <div class="q-meta">
      <div class="domain-badge">M-CHAT-R</div>
      <div class="q-counter">${S.qIdx+1} ${t('quiz.of')} ${QS.length}</div>
    </div>
    <div class="q-text">${q[S.lang] || q.ru}</div>
    <button class="ans-btn yes" onclick="answer('yes')">${t('quiz.yes')}</button>
    <button class="ans-btn no" onclick="answer('no')">${t('quiz.no')}</button>
  </div>`;
}

function screenReport() {
  const { score, flagged } = calcScore();
  const cls = riskCls(score);
  const emoji = {green:'✅', yellow:'⚠️', red:'🚨'}[cls];
  const childLabel = S.childName || t('report.child');
  const date = new Date().toLocaleDateString(S.lang==='kz'?'kk-KZ':'ru-RU');
  const outOfRange = ageOutOfRange();

  const flagRows = flagged.map(q =>
    `<div class="flag-item"><span class="flag-num">${q.id}</span><span>${q[S.lang] || q.ru}</span></div>`
  ).join('');

  const printFlags = flagged.map(q =>
    `<div class="print-domain-row"><span><strong>№${q.id}</strong> ${q[S.lang] || q.ru}</span></div>`
  ).join('');

  return `${nav(false)}<div class="content">
    <div class="report-center">
      <div class="report-light light-${cls}">${emoji}</div>
      <div class="report-lvl lvl-${cls}">${t('report.lvl'+cap(cls))}</div>
      <div class="score-big sc-${cls}">${score} ${t('report.score')}</div>
      <div class="report-meta">${childLabel} · ${t('report.age')} ${S.childAge} ${t('report.mo')} · ${date}</div>
    </div>
    <div class="rec rec-${cls}">${t('report.rec'+cap(cls))}</div>
    ${outOfRange ? `<div class="age-warn">${t('child.warn')}</div>` : ''}
    ${flagged.length ? `<div class="domains-label">${t('report.flagsSec')}</div><div class="flag-list">${flagRows}</div>` : ''}
    <button class="btn btn-primary no-print" onclick="savePDF()">${t('report.pdf')}</button>
    <button class="btn btn-secondary no-print" onclick="goTo('welcome')">${t('report.again')}</button>
    <div class="disclaimer" style="margin-top:20px;">${t('report.disc')}</div>
    <p class="footer-note">Diagnostic 360 · Basqa Development Space · M-CHAT-R™ © 2009 Robins, Fein, & Barton</p>
  </div>

  <div class="print-report" style="padding:24px 20px;font-family:Arial,sans-serif;">
    <h2 style="color:#1F3864;margin-bottom:2px;">M-CHAT-R · Diagnostic 360</h2>
    <p style="color:#6B7280;font-size:11px;margin-bottom:14px;">Basqa Development Space · ${date}</p>
    <h3 style="margin-bottom:8px;">${t('report.title')}</h3>
    <p style="margin-bottom:4px;"><strong>${childLabel}</strong> · ${t('report.age')} ${S.childAge} ${t('report.mo')}</p>
    <p style="margin-bottom:12px;font-size:14px;">${t('report.lvl'+cap(cls))} — ${score} ${t('report.score')}</p>
    <p style="margin-bottom:14px;font-size:13px;">${t('report.rec'+cap(cls)).replace(/^[✓⚠🚨]\s*/,'')}</p>
    ${outOfRange ? `<p style="margin-bottom:12px;font-size:12px;color:#7F3B00;">${t('child.warn')}</p>` : ''}
    ${flagged.length ? `<p style="font-weight:700;font-size:13px;margin-bottom:6px;">${t('report.flagsSec')}:</p><div>${printFlags}</div>` : `<p style="font-size:13px;">${t('report.noFlags')}</p>`}
    <p style="margin-top:14px;font-size:11px;color:#6B7280;">${t('report.disc')} · M-CHAT-R™ © 2009 Robins, Fein, & Barton</p>
  </div>`;
}

// ─────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────
function render() {
  const map = { welcome:screenWelcome, child:screenChild, quiz:screenQuiz, report:screenReport };
  document.getElementById('app').innerHTML = (map[S.screen] || screenWelcome)();
}
render();
</script>
</body>
</html>
