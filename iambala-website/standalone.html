<script>

  theme: {

<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Nunito', system-ui, sans-serif; color: #2D2D2D; }
  .font-display { font-family: 'Playfair Display', Georgia, serif; }

  .fade-section { opacity: 0; transform: translateY(28px); transition: opacity .75s ease-out, transform .75s ease-out; }
  .fade-section.visible { opacity: 1; transform: translateY(0); }

  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes floatSlow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .animate-float { animation: float 6s ease-in-out infinite; }
  .animate-float-slow { animation: floatSlow 9s ease-in-out infinite; }

  .card-hover { transition: all .3s ease; }
  .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,.12); }

  .btn-primary { background:#4DC8D8; color:#fff; font-weight:600; border-radius:999px; padding:14px 32px; border:none; cursor:pointer; transition:all .2s; font-family:Nunito,sans-serif; font-size:15px; }
  .btn-primary:hover { background:#3ab8c8; transform:translateY(-2px); box-shadow:0 8px 24px rgba(77,200,216,.35); }
  .btn-outline { background:transparent; color:#fff; font-weight:600; border-radius:999px; padding:12px 30px; border:2px solid rgba(255,255,255,.5); cursor:pointer; transition:all .2s; font-family:Nunito,sans-serif; font-size:15px; }
  .btn-outline:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.85); }

  .lang-btn { padding:4px 12px; border-radius:999px; border:none; cursor:pointer; font-family:Nunito,sans-serif; font-size:12px; font-weight:700; transition:all .2s; background:transparent; color:rgba(255,255,255,.7); }
  .lang-btn.active { background:#4DC8D8; color:#fff; }
  .lang-btn.scrolled { color:#888; }
  .lang-btn.scrolled.active { background:#4DC8D8; color:#fff; }
  .lang-btn:hover { color:#fff; }
  .lang-btn.scrolled:hover { color:#4DC8D8; }

  input, textarea { outline:none; font-family:Nunito,sans-serif; }
  input:focus, textarea:focus { border-color:#4DC8D8 !important; box-shadow: 0 0 0 3px rgba(77,200,216,.15); }
  textarea { resize:none; }

  /* Mobile menu */
  #mobile-menu { max-height:0; overflow:hidden; transition:max-height .3s ease, opacity .3s ease; opacity:0; }
  #mobile-menu.open { max-height:280px; opacity:1; }

  .ham-line { display:block; width:20px; height:2px; border-radius:2px; transition:all .3s; }
  .ham.open .ham-line:nth-child(1) { transform:rotate(45deg) translate(4px,4px); }
  .ham.open .ham-line:nth-child(2) { opacity:0; transform:scaleX(0); }
  .ham.open .ham-line:nth-child(3) { transform:rotate(-45deg) translate(4px,-4px); }
</style>

<body class="bg-white">

<!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
<header id="header" class="fixed inset-x-0 top-0 z-50 transition-all duration-300">

          <circle cx="15" cy="26" r="13" fill="#4DC8D8" fill-opacity=".93"/>
          <circle cx="29" cy="26" r="13" fill="#8DC63F" fill-opacity=".93"/>

          <div id="logo-note" class="text-[10px] font-medium transition-colors text-white/60" data-key="nameNote"></div>
        </div>
      </button>

      <!-- Desktop nav -->

        <button onclick="scrollTo('mission')" class="nav-link text-sm font-medium text-white/85 hover:text-brand-teal transition-colors bg-transparent border-none cursor-pointer" data-key="nav.mission"></button>
        <button onclick="scrollTo('programs')" class="nav-link text-sm font-medium text-white/85 hover:text-brand-teal transition-colors bg-transparent border-none cursor-pointer" data-key="nav.programs"></button>
        <button onclick="scrollTo('team')" class="nav-link text-sm font-medium text-white/85 hover:text-brand-teal transition-colors bg-transparent border-none cursor-pointer" data-key="nav.team"></button>
        <button onclick="scrollTo('contact')" class="nav-link text-sm font-medium text-white/85 hover:text-brand-teal transition-colors bg-transparent border-none cursor-pointer" data-key="nav.contact"></button>
      </nav>

      <div class="flex items-center gap-3">

        <div id="lang-wrap" class="flex rounded-full p-0.5" style="background:rgba(255,255,255,.2)">

          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('kz')">KZ</button>
        </div>
        <!-- Hamburger -->
        <button class="ham md:hidden flex flex-col justify-center items-center gap-1.5 w-8 h-8 bg-transparent border-none cursor-pointer" onclick="toggleMenu()" id="ham-btn">
          <span class="ham-line bg-white"></span>
          <span class="ham-line bg-white"></span>
          <span class="ham-line bg-white"></span>
        </button>
      </div>
    </div>
  </div>
  <!-- Mobile menu -->
  <div id="mobile-menu" class="md:hidden bg-white border-t border-gray-100">
    <button onclick="scrollTo('mission');toggleMenu()" class="block w-full text-left px-6 py-3 text-sm font-medium text-gray-700 hover:text-brand-teal hover:bg-gray-50 transition-colors bg-transparent border-none cursor-pointer" data-key="nav.mission"></button>
    <button onclick="scrollTo('programs');toggleMenu()" class="block w-full text-left px-6 py-3 text-sm font-medium text-gray-700 hover:text-brand-teal hover:bg-gray-50 transition-colors bg-transparent border-none cursor-pointer" data-key="nav.programs"></button>
    <button onclick="scrollTo('team');toggleMenu()" class="block w-full text-left px-6 py-3 text-sm font-medium text-gray-700 hover:text-brand-teal hover:bg-gray-50 transition-colors bg-transparent border-none cursor-pointer" data-key="nav.team"></button>
    <button onclick="scrollTo('contact');toggleMenu()" class="block w-full text-left px-6 py-3 text-sm font-medium text-gray-700 hover:text-brand-teal hover:bg-gray-50 transition-colors bg-transparent border-none cursor-pointer" data-key="nav.contact"></button>
  </div>
</header>

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentLang = 'ru';

function get(key) {
  const parts = key.split('.');
  let v = T[currentLang];
  for (const p of parts) v = v?.[p];
  return v ?? '';
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const t = T[currentLang];

  // Simple text nodes
  document.querySelectorAll('[data-key]').forEach(el => {
    const v = get(el.dataset.key);
    if (typeof v === 'string') el.textContent = v;
  });

  // Placeholder attributes
  document.querySelectorAll('[data-ph]').forEach(el => {
    el.placeholder = get(el.dataset.ph);
  });

  // Values grid
  const vg = document.getElementById('values-grid');
  const valColors = ['#4DC8D8','#8DC63F','#F7941D','#F15A29','#4DC8D8','#8DC63F'];
  vg.innerHTML = t.values.items.map((item, i) => `
    <div class="bg-white rounded-2xl p-7 shadow-sm card-hover relative overflow-hidden" style="cursor:default">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl mb-5" style="background:${valColors[i]}18">${item.icon}</div>
      <h3 class="font-display text-base font-bold mb-2" style="color:#2D2D2D">${item.name}</h3>
      <p class="text-gray-500 text-sm leading-relaxed">${item.text}</p>
      <div class="absolute bottom-0 left-0 right-0 h-0.5 opacity-0 transition-opacity duration-300" style="background:${valColors[i]}" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0"></div>
    </div>
  `).join('');

  // Programs grid
  const pg = document.getElementById('programs-grid');
  pg.innerHTML = t.programs.items.map(c => `
    <div class="bg-white rounded-2xl p-8 shadow-sm card-hover relative overflow-hidden" style="border:1px solid #f3f4f6;cursor:default">
      <div class="absolute top-0 inset-x-0 h-1 rounded-t-2xl" style="background:${c.accent}"></div>
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-6" style="background:${c.accent}14">${c.icon}</div>
      <h3 class="font-display text-xl font-bold mb-1" style="color:#2D2D2D">${c.title}</h3>
      <p class="text-xs font-bold uppercase tracking-wider mb-4" style="color:${c.accent}">${c.sub}</p>
      <p class="text-gray-500 text-sm leading-relaxed mb-6">${c.text}</p>
      <div class="flex items-center justify-between pt-4" style="border-top:1px solid #f3f4f6">
        <span class="text-xs font-semibold text-gray-400">${c.result}</span>
        <span class="text-xs font-bold" style="color:${c.accent}">${c.budget}</span>
      </div>
      <div class="absolute -bottom-8 -right-8 w-28 h-28 rounded-full" style="background:${c.accent};opacity:.06"></div>
    </div>

  // Strategy grid
  const stratColors = ['#4DC8D8','#8DC63F','#F7941D','#F15A29'];
  const sg = document.getElementById('strategy-grid');
  sg.innerHTML = t.strategy.items.map((item, i) => `
    <div class="rounded-2xl p-6 card-hover" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);cursor:default">
      <div class="text-3xl mb-4">${item.icon}</div>
      <h3 class="font-display text-base font-bold text-white mb-2">${item.title}</h3>
      <p class="text-sm leading-relaxed mb-4" style="color:rgba(255,255,255,.6)">${item.desc}</p>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold text-white" style="background:${stratColors[i]}50">🎯 ${item.target}</span>
    </div>
  `).join('');

  // Roadmap
  const rg = document.getElementById('roadmap-grid');
  rg.innerHTML = t.strategy.roadmap.map(r => `
    <div class="text-center rounded-2xl p-6" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)">
      <div class="text-xs font-bold uppercase tracking-widest mb-2" style="color:rgba(255,255,255,.5)">${r.year}</div>
      <div class="font-display text-4xl font-bold text-white mb-1">${r.value}</div>

  // Funders

  // Team grid
  const [featured, ...others] = t.team.members;

    <!-- Featured director -->

          <h3 class="font-display text-xl font-bold mb-0.5" style="color:#2D2D2D">${featured.name}</h3>
          <p class="font-semibold text-sm mb-4" style="color:#4DC8D8">${featured.title}</p>
          <p class="text-gray-500 text-sm leading-relaxed mb-4">${featured.bio}</p>
          ${featured.ig ? `<a href="#" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-brand-teal transition-colors">📸 ${featured.ig}</a>` : ''}
        </div>
      </div>
    </div>
    <!-- Right column -->
    <div class="flex flex-col gap-5">
      ${others.map((m, i) => `
        <div class="bg-white rounded-2xl p-6 shadow-sm card-hover" style="border:1px solid #f3f4f6">
          <div class="flex items-start gap-5">
            <div class="w-14 h-14 rounded-full flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#f3f4f6,#e5e7eb)">
              <span style="font-size:28px">${['👩','👩‍💻'][i]}</span>
            </div>
            <div>
              <h4 class="font-display text-base font-bold mb-0.5" style="color:#2D2D2D">${m.name}</h4>
              <p class="text-xs font-semibold mb-2" style="color:#F7941D">${m.title}</p>
              <p class="text-gray-500 text-xs leading-relaxed">${m.bio}</p>
            </div>
          </div>
        </div>
      `).join('')}
      <div class="rounded-2xl p-5 space-y-1.5" style="background:linear-gradient(135deg,rgba(77,200,216,.08),rgba(141,198,63,.08));border:1px solid rgba(77,200,216,.15)">
        <p class="text-xs font-bold uppercase tracking-widest mb-2" style="color:#4DC8D8">${ri.label}</p>
        <p class="text-gray-600 text-xs">📅 ${ri.date}</p>
        <p class="text-gray-600 text-xs">🔢 ${ri.bin}</p>
        <p class="text-gray-600 text-xs">📍 ${ri.addr}</p>
      </div>
    </div>
  `;

  // Contact coop tags
  const coopColors = ['#4DC8D8','#8DC63F','#F7941D','#F15A29'];
  document.getElementById('coop-tags').innerHTML = t.contact.coopItems.map((item, i) =>
    `<span class="px-3 py-1 rounded-full text-xs font-semibold text-white" style="background:${coopColors[i]}">${item}</span>`
  ).join('');

  // Form success message
  const formOkEl = document.querySelector('#form-success [data-key="contact.formOk"]');
  if (formOkEl) formOkEl.textContent = t.contact.formOk;

  // Scrolled header state
  updateHeaderState();
}

// ─── LANG ────────────────────────────────────────────────────────────────────
function setLang(l) {
  currentLang = l;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent === l.toUpperCase()) btn.classList.add('active');
  });
  render();
}

// ─── HEADER SCROLL ───────────────────────────────────────────────────────────
function updateHeaderState() {
  const header = document.getElementById('header');
  const isScrolled = window.scrollY > 24;
  if (isScrolled) {
    header.style.background = 'rgba(255,255,255,.97)';
    header.style.boxShadow = '0 1px 8px rgba(0,0,0,.08)';
    document.getElementById('logo-name').style.color = '#2D2D2D';
    document.getElementById('logo-note').style.color = '#9ca3af';
    document.getElementById('lang-wrap').style.background = '#f3f4f6';
    document.querySelectorAll('.nav-link').forEach(el => el.style.color = '#6b7280');
    document.querySelectorAll('.ham-line').forEach(el => el.style.background = '#374151');
    document.querySelectorAll('.lang-btn').forEach(el => {
      el.classList.add('scrolled');
    });
  } else {
    header.style.background = 'transparent';
    header.style.boxShadow = 'none';
    document.getElementById('logo-name').style.color = '#fff';
    document.getElementById('logo-note').style.color = 'rgba(255,255,255,.6)';
    document.getElementById('lang-wrap').style.background = 'rgba(255,255,255,.2)';
    document.querySelectorAll('.nav-link').forEach(el => el.style.color = 'rgba(255,255,255,.85)');
    document.querySelectorAll('.ham-line').forEach(el => el.style.background = '#fff');
    document.querySelectorAll('.lang-btn').forEach(el => el.classList.remove('scrolled'));
  }
}
window.addEventListener('scroll', updateHeaderState, { passive: true });

// ─── MOBILE MENU ─────────────────────────────────────────────────────────────
function toggleMenu() {
  const menu = document.getElementById('mobile-menu');
  const btn = document.getElementById('ham-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}

// ─── SCROLL TO ───────────────────────────────────────────────────────────────
function scrollTo(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
}

// ─── FORM SUBMIT ─────────────────────────────────────────────────────────────
function submitForm(e) {
  e.preventDefault();
  document.getElementById('contact-form').style.display = 'none';
  const success = document.getElementById('form-success');
  success.classList.remove('hidden');
  success.style.display = 'flex';
}

// ─── INTERSECTION OBSERVER ───────────────────────────────────────────────────
const obs = new IntersectionObserver(
  entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }),
  { threshold: 0.1 }
);
document.querySelectorAll('.fade-section').forEach(el => obs.observe(el));

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
